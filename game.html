      if (s.n > 1) digits(s.n, x + 17 - String(s.n).length * 4, hy + 12, '#f2e6da');
      if (s.id === IT.TORCH) { rect(x + 2, hy + 15, 14, 1, '#2a2226'); rect(x + 2, hy + 15, Math.round(14 * s.f), 1, '#ffb04a'); }

}
const flakes = Array.from({ length: 110 }, () => ({ x: Math.random() * 2000, y: Math.random() * 2000, vx: -8 - Math.random() * 8, vy: 12 + Math.random() * 14, ph: Math.random() * 6, s: Math.random() < .2 ? 2 : 1 }));
let hover = null;
function hoverTarget() {
  if (!mouse.seen || mouse.touch) return null;

  for (const m of mobs) if (Math.abs(wx - m.x) < 9 && wy < m.y + 3 && wy > m.y - (m.k === 'walker' ? 30 : 12)) return { mob: m };
  let found = null, bd = 1e9;
  for (const o of objs) {
    if (!OBJ[o.k].work && o.k !== 'fire') continue;
    const sp = SPR[o.k][o.k === 'bush' || o.k === 'grass' ? 0 : o.v], hw = Math.max(7, sp.width / 2 - 2);
    if (Math.abs(wx - o.x) < hw && wy < o.y + 5 && wy > o.y - sp.height + 2) { const d = Math.abs(wy - o.y) + Math.abs(wx - o.x); if (d < bd) { bd = d; found = { obj: o }; } }

}
function render(dt, t) {

  for (const o of list) if (OBJ[o.k].r || o.k === 'grass' || o.k === 'cap') { const sh = shadow(Math.max(8, Math.min(26, SPR[o.k][0].width - 6))); ctx.drawImage(sh, Math.round(o.x - sh.width / 2 - cx), Math.round(o.y - sh.height / 2 - cy)); }
  for (const m of mobs) { const sh = shadow(m.k === 'walker' ? 14 : 10); ctx.drawImage(sh, Math.round(m.x - sh.width / 2 - cx), Math.round(m.y - sh.height / 2 - cy)); }

    if (e.o) {
      const o = e.o, x = Math.round(o.x - cx), y = Math.round(o.y - cy);
      if (o.k === 'fire') { drawFire(o, x, y, t, eyes); continue; }
      const sp = SPR[o.k][o.k === 'bush' || o.k === 'grass' ? (o.ripe ? 0 : 1) : o.v];
      const jig = o.shake > 0 ? Math.round(Math.sin(o.shake * 60)) : 0;
      ctx.drawImage(sp, x - (sp.width >> 1) + jig, y - sp.height + 2);
    } else if (e.m) { const m = e.m, x = Math.round(m.x - cx), y = Math.round(m.y - cy); if (m.k === 'walker') drawWalker(m, x, y, eyes); else drawCritter(m, x, y); }
    else if (e.d) { const d = e.d; ctx.drawImage(ICON[d.id], Math.round(d.x - cx - 5), Math.round(d.y - cy - 9 + Math.sin(d.age * 4) * 1.5), 10, 10); }
    else if (e.pl) drawPlayer(Math.round(p.x - cx), Math.round(p.y - cy), eyes);
    else if (e.q) { const q = e.q; ctx.globalAlpha = clamp(q.life / q.max * 1.5, 0, 1); rect(Math.round(q.x - cx), Math.round(q.y - cy), 2, 2, q.c); ctx.globalAlpha = 1; }
  }
  for (const q of parts) if (!q.z && !q.glow) { ctx.globalAlpha = clamp(q.life / q.max * 1.5, 0, 1); rect(Math.round(q.x - cx), Math.round(q.y - cy), 2, 2, q.c); }
  ctx.globalAlpha = 1;
  for (const f of flakes) {
    f.x += (f.vx + Math.sin(f.ph += dt) * 6) * dt; f.y += f.vy * dt;
    rect(Math.round(((f.x % bufW) + bufW) % bufW), Math.round(((f.y % bufH) + bufH) % bufH), f.s, f.s, 'rgba(165,158,150,.5)');
  }
  drawLight(cx, cy);
  ctx.globalCompositeOperation = 'lighter';
  for (const q of parts) if (q.glow) { ctx.globalAlpha = clamp(q.life / q.max, 0, 1); rect(Math.round(q.x - cx), Math.round(q.y - cy), 1, 1, q.c); rect(Math.round(q.x - cx) - 1, Math.round(q.y - cy) - 1, 3, 3, 'rgba(255,120,40,.18)'); }
  ctx.globalAlpha = 1;
  for (const e of eyes) if (e.halo) rect(e.x - 2, e.y - 2, e.s + 4, (e.hh || e.s) + 3, e.halo);
  ctx.globalCompositeOperation = 'source-over';
  for (const e of eyes) { if (e.bar) { rect(e.x, e.y, 12, 2, '#1a0e0e'); rect(e.x, e.y, Math.round(12 * clamp(e.f, 0, 1)), 2, '#c8392f'); } else if (e.c) rect(e.x, e.y, e.s, e.s, e.c); }
  const tgt = (p.goal && (p.goal.obj || p.goal.mob)) ? p.goal : hover;
  if (tgt && state === 'play') {
    const o = tgt.obj || tgt.mob, x = Math.round(o.x - cx), y = Math.round(o.y - cy) + 4;
    rect(x - 7, y, 4, 1, 'rgba(255,214,170,.7)'); rect(x + 4, y, 4, 1, 'rgba(255,214,170,.7)'); rect(x - 7, y - 2, 1, 2, 'rgba(255,214,170,.7)'); rect(x + 7, y - 2, 1, 2, 'rgba(255,214,170,.7)');
  }
  drawHUD();
}

// ───────────────────────── loop ─────────────────────────
function updateCamera(dt, snap) {
  const tx = clamp(p.x - bufW / 2, -bufW * .25, WPX - bufW * .75), ty = clamp(p.y - 12 - bufH / 2, -bufH * .25, WPX - bufH * .75);
  if (snap) { cam.x = tx; cam.y = ty; return; }
  cam.x += (tx - cam.x) * Math.min(1, dt * 6); cam.y += (ty - cam.y) * Math.min(1, dt * 6);
}
function phaseLabel(ph) { return ph < .5 ? 'день' : ph < .62 ? 'сумерки' : ph < .9 ? 'ночь' : 'рассвет'; }
function step(dt, t) {
  time += dt;
  curPhase = (time % CYCLE) / CYCLE; amb = ambAt(curPhase);
  const lbl = phaseLabel(curPhase);
  if (lbl !== phaseName) {
    if (phaseName && lbl === 'сумерки') toast(objs.some(o => o.k === 'fire' && o.fuel > 0) ? 'Темнеет. Держись у огня' : 'Темнеет. Без огня ночь не пережить: крафт → Костёр', 4000);
    if (phaseName && lbl === 'рассвет') toast('Рассвет. Ходоки сгорают на свету', 3000);
    phaseName = lbl;
  }
  if (!hints.dusk && curPhase > .38 && curPhase < .5 && !objs.some(o => o.k === 'fire')) { hints.dusk = 1; toast('Скоро закат. Собери дерево 3 и камень 4 на костёр', 4000); }
  buildLights(t);
  updatePlayer(dt); updateMobs(dt); updateWorld(dt); spawnMobs(dt);
  if (AC && drone) drone.gain.setTargetAtTime(muted ? 0 : (1 - amb / 15) * .12, AC.currentTime, .8);
  saveT += dt; if (saveT > 12) { saveT = 0; if (dirty && state === 'play') save(); }
}
let last = performance.now(), acc = 0, infoT = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000), t = now / 1000; last = now;
  if (state === 'play') {
    if (hitstop > 0) hitstop -= dt;
    else { acc += dt; while (acc >= 1 / 60 && state === 'play') { step(1 / 60, t); acc -= 1 / 60; } }
    hover = hoverTarget();
  } else {
    acc = 0; curPhase = (time % CYCLE) / CYCLE; amb = ambAt(curPhase);
    if (state === 'dead') updateMobs(dt);
  }
  shake = Math.max(0, shake - dt * 18);
  updateParts(dt); updateCamera(dt);
  render(dt, t);
  infoT -= dt;
  if (infoT <= 0) { infoT = .2; infoEl.innerHTML = `День ${Math.floor(time / CYCLE) + 1} · <b>${phaseLabel(curPhase)}</b>`; updateHint(); }
  requestAnimationFrame(frame);
}

// ───────────────────────── UI ─────────────────────────
const infoEl = document.getElementById('info'), toastEl = document.getElementById('toast'), flashEl = document.getElementById('flash'), screenEl = document.getElementById('screen'), hintEl = document.getElementById('hint');
let toastTimer = 0;
function toast(msg, ms = 2400) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms); }
function flash() { flashEl.style.opacity = 1; setTimeout(() => flashEl.style.opacity = 0, 120); }
function updateHint() {
  if (state !== 'play' || !hover) { hintEl.hidden = true; return; }
  const o = hover.obj, m = hover.mob;
  let txt = m ? (m.k === 'walker' ? 'Пепельный ходок' : 'Пеплохвост') : OBJ[o.k].name;
  if (o && o.k === 'fire') txt += o.fuel > 0 ? ` · огонь ${Math.round(o.fuel * 100)}%` : ' · погас, подкинь дерево';
  if (o && OBJ[o.k].tool && !hasTool(OBJ[o.k].tool)) txt += ` · <i>${OBJ[o.k].tool === 'axe' ? 'нужен топор' : 'нужна кирка'}</i>`;
  if (o && !o.ripe) txt += ' · отрастает';

}
const KEYS_HTML = `<dl class="keys">
  <dt>WASD / стрелки</dt><dd>идти</dd>
  <dt>ЛКМ</dt><dd>подойти и собрать, рубить, бить. Клик по земле — идти туда</dd>
  <dt>Пробел, держать</dt><dd>собирать всё вокруг</dd>
  <dt>ПКМ или F</dt><dd>использовать предмет: съесть, поставить, подкинуть в костёр, пожарить мясо</dd>
  <dt>1–8, колесо</dt><dd>выбрать предмет в сумке</dd>
  <dt>C</dt><dd>крафт</dd>
</dl>`;
function showScreen(kind, why, days) {
  screenEl.hidden = false;
  const hasSave = !!readSave(), b = best();

    screenEl.innerHTML = `<div class="card">
      <h1>Пепельная пустошь</h1>
      <p>Небо сыплет пеплом, деревья давно умерли. Днём собирай ветки, камни и траву. К закату разведи костёр: ночью холод убивает, а из темноты выходят ходоки, которые боятся только огня.</p>
      ${KEYS_HTML}
      <p class="muted">На телефоне: тап — идти или собрать, кнопки справа — действие и использовать предмет.${b ? ` Рекорд: ${b} дн.` : ''}</p>
      <div class="row">${hasSave ? '<button class="primary" id="sContinue">Продолжить</button><button id="sNew">Новый мир</button>' : '<button class="primary" id="sNew">Начать</button>'}</div>
    </div>`;
  } else if (kind === 'pause') {

      <div class="row"><button class="primary" id="sContinue">Продолжить</button><button id="sNew">Новый мир</button></div></div>`;
  } else if (kind === 'dead') {

    screenEl.innerHTML = `<div class="card"><h2>Огонь угас</h2><p>${txt} Прожито дней: <b>${days}</b>. Рекорд: ${best()}.</p>
      <div class="row"><button class="primary" id="sNew">Новый мир</button></div></div>`;
  } else if (kind === 'craft') {
    screenEl.innerHTML = `<div class="card"><h2>Крафт</h2><div class="recipes" id="recipes"></div><div class="row"><button id="sClose">Закрыть <kbd>C</kbd></button></div></div>`;
    renderCraft();
  }
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };

function hideScreen() { screenEl.hidden = true; screenEl.innerHTML = ''; }
function renderCraft() {
  const box = document.getElementById('recipes'); if (!box) return;
  box.innerHTML = RECIPES.map((r, k) => `<div class="recipe"><img src="${ICON_URL[r.out]}" alt="">
    <div><div class="nm">${ITEM[r.out].name}</div>
    <div class="need">${r.need.map(([id, n]) => `<span class="${count(id) >= n ? 'ok' : 'no'}">${ITEM[id].name} ${count(id)}/${n}</span>`).join(' · ')}<br>${r.note}</div></div>
    <button data-r="${k}" ${canCraft(r) ? '' : 'disabled'}>Создать</button></div>`).join('');

function openCraft() { if (state !== 'play') return; state = 'craft'; showScreen('craft'); }
function closeCraft() { state = 'play'; hideScreen(); }
function togglePause() {
  if (state === 'play') { state = 'pause'; save(); showScreen('pause'); }
  else if (state === 'pause') { state = 'play'; hideScreen(); }
  else if (state === 'craft') closeCraft();
}
document.getElementById('bCraft').onclick = () => state === 'craft' ? closeCraft() : openCraft();
document.getElementById('bMenu').onclick = togglePause;
document.getElementById('bSound').onclick = e => { muted = !muted; e.currentTarget.textContent = 'Звук: ' + (muted ? 'выкл' : 'вкл'); if (master) master.gain.value = muted ? 0 : .55; audioInit(); };

// ───────────────────────── input ─────────────────────────
const KEYMAP = { KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', Space: 'act' };
addEventListener('keydown', e => {
  if (e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyC') { state === 'craft' ? closeCraft() : openCraft(); return; }
  if (state !== 'play') return;
  const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); input[k] = 1; }
  if (/^Digit[1-8]$/.test(e.code)) sel = +e.code[5] - 1;
  if (e.code === 'KeyF' && !e.repeat) useItem(null);
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) input[k] = 0; });
addEventListener('blur', () => { for (const k in input) input[k] = 0; });
function setMouse(e) { mouse.x = e.clientX / scale; mouse.y = e.clientY / scale; }
canvas.addEventListener('pointerdown', e => {
  setMouse(e); audioInit();
  if (state !== 'play') return;
  const h = hotbarRect;
  if (h && mouse.x >= h.x && mouse.x < h.x + h.w && mouse.y >= h.y && mouse.y < h.y + h.h) { sel = clamp(Math.floor((mouse.x - h.x) / 19), 0, inv.length - 1); return; }

if (matchMedia('(pointer: coarse)').matches) document.getElementById('touch').hidden = false;

tAct.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); input.act = 1; tAct.setPointerCapture(e.pointerId); });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) tAct.addEventListener(ev, () => { input.act = 0; });

document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && dirty) save(); });
addEventListener('pagehide', () => { if ((state === 'play' || state === 'pause') && dirty) save(); });

// ───────────────────────── boot ─────────────────────────
function start(data) {
  resize();
  if (!(data && data.save && loadFrom(data.save)) && !loadFrom(readSave())) freshWorld();
  curPhase = (time % CYCLE) / CYCLE; amb = ambAt(curPhase); phaseName = phaseLabel(curPhase);
  updateCamera(0, true);
  showScreen('title');
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.snapshot?.(() => ({ save: state === 'dead' ? null : serialize() }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
